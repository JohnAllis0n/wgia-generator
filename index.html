<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark; background: #000">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/wgia-red.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <!-- Start fetching the card font straight away: the card can't draw until it arrives. -->
    <link
      rel="preload"
      href="/fonts/futura-bold-oblique.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <title>WGIA Generator</title>
    <meta name="description" content="Make your own Wor$t Girl in America card, as a PNG or MP4." />

    <!-- Link previews (iMessage, WhatsApp, Discord, X, etc.). Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wgia.jallison.co.uk/" />
    <meta property="og:site_name" content="WGIA Generator" />
    <meta property="og:title" content="Wor$t Girl Generator" />
    <meta property="og:description" content="Make your own Wor$t Girl in America card, as a PNG or MP4." />
    <meta property="og:image" content="https://wgia.jallison.co.uk/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wor$t Girl Generator, next to a Wor$t Girl in America card over fireworks" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wor$t Girl Generator" />
    <meta name="twitter:description" content="Make your own Wor$t Girl in America card, as a PNG or MP4." />
    <meta name="twitter:image" content="https://wgia.jallison.co.uk/og-image.jpg" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
